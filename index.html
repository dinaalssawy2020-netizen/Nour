
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title> نور   لين وأنس 
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',sans-serif}
body{background:#FFF8E1;min-height:100vh}
.header{background:#5B0F11;padding:28px 20px 40px;text-align:center;border-radius:0 0 32px 32px;border-bottom:4px solid #FFD60A}
.header h1{color:#FFD60A;font-size:34px;font-weight:900;letter-spacing:1px}
.header p{color:#FFE082;font-size:14px;font-weight:800;margin-top:4px}
.goal{background:#FFD60A;border:3px solid #5B0F11;border-radius:18px;padding:14px;margin:-18px auto 0;width:92%;max-width:460px;box-shadow:0 5px 0 #5B0F11;display:flex;align-items:center;gap:12px}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px;width:92%;max-width:460px;margin:12px auto 0}
.pill{background:#fff;border:2.5px solid #5B0F11;border-radius:14px;padding:11px 4px;font-weight:900;font-size:12px;color:#5B0F11;text-align:center;cursor:pointer}
.pill.active{background:#5B0F11;color:#FFD60A;box-shadow:0 3px 0 #FFD60A}
.wrap{width:92%;max-width:460px;margin:14px auto}
.card{border-radius:18px;padding:16px;margin-bottom:12px;border:2.5px solid #5B0F11;box-shadow:0 4px 0 #5B0F11}
.card.yellow{background:#FFD60A}
.card.light{background:#FFF3B0}
.card h3{font-size:14px;font-weight:900;color:#5B0F11}
.card p{font-size:12.5px;line-height:1.8;margin-top:6px;color:#5B0F11;font-weight:800}
.btn{width:100%;border-radius:12px;padding:11px;font-weight:900;margin-top:8px;cursor:pointer;border:2.5px solid #5B0F11;font-size:12px}
.btn.burgundy{background:#5B0F11;color:#FFD60A}
.btn.yellow{background:#FFD60A;color:#5B0F11}
.btn.small{width:auto;display:inline-block;padding:8px 14px;margin:6px 4px 0 0}
.btn.done{background:#5B0F11!important;color:#FFD60A!important;opacity:1}
.hidden{display:none!important}
.storyBox{display:none;background:#FFF8E1;border:2px dashed #5B0F11;border-radius:12px;padding:10px;margin-top:10px;font-size:13px;font-weight:800;line-height:1.8;color:#5B0F11}
.footer{text-align:center;padding:24px 0}
.footer b{background:#5B0F11;color:#FFD60A;border-radius:100px;padding:8px 18px;font-size:11px;display:inline-block;border:2px solid #FFD60A}
.footer span{display:block;margin-top:8px;color:#8A6A6A;font-size:10px;font-weight:700}
canvas{border:2.5px solid #5B0F11;border-radius:14px;background:#fff;width:100%;height:200px;touch-action:none;margin-top:8px}
</style>
</head>
<body>
<div class="header"><div style="font-size:38px">🌙</div><h1>نور</h1><p>رحلة أنس ولين - 5 فروض</p></div>

<div class="goal">
<div id="tree" style="font-size:36px">🌱</div>
<div>
<div style="font-weight:900;font-size:13px;color:#5B0F11">هدف اليوم: 5 فروض + قصة + دعاء</div>
<div id="starsCount" style="font-weight:900;font-size:18px;color:#5B0F11;margin-top:2px">⭐ 0 / 7 نجوم</div>
</div>
</div>

<div class="pills">
<div class="pill active" onclick="showTab('salah',this)">🕌 صلاتي</div>
<div class="pill" onclick="showTab('qesas',this)">📖 قصصي</div>
<div class="pill" onclick="showTab('adab',this)">🤲 أدعيتي</div>
<div class="pill" onclick="showTab('game',this)">🎨 لعبتي</div>
<div class="pill" onclick="showTab('week',this)">📅 أسبوعي</div>
<div class="pill" onclick="showTab('stars',this)">🏆 جايزتي</div>
</div>

<div class="wrap">
<div id="salah">
<div class="card yellow">
<h3>💧 الوضوء - 10 خطوات</h3>
<p>  النية بعدها بسم الله  اليدين  المضمضة  الاستنشاق غسل الوجه  الذراعين  مسح الرأس الأذنين  القدمين </p>
<div class="storyBox" id="wuduText">أشهد أن لا إله إلا الله وحده لا شريك له وأشهد أن محمداً عبده ورسوله</div>
<button class="btn burgundy" onclick="playStory('الوضوء: النية، بسم الله، غسل اليدين ثلاثا، المضمضة ثلاثا، الاستنشاق ثلاثا، غسل الوجه ثلاثا، غسل الذراعين إلى المرفقين ثلاثا، مسح الرأس، مسح الأذنين، غسل القدمين ثلاثا','wuduText')">🔊 اسمعي الوضوء - دوسي هنا</button>
<div style="font-size:10px;font-weight:800;color:#5B0F11;margin-top:6px">لو الصوت مش شغال: افتحي الصوت من جنب الموبايل ودوسي تاني، النص هيظهر تحت</div>
</div>

<div class="card light">
<h3>🕌 صلواتي الخمس - كل فرض بنجمة ⭐</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
<button class="btn yellow" style="width:100%" onclick="addPrayer(this,'الفجر')">🌅 الفجر</button>
<button class="btn yellow" style="width:100%" onclick="addPrayer(this,'الظهر')">☀️ الظهر</button>
<button class="btn yellow" style="width:100%" onclick="addPrayer(this,'العصر')">🌤️ العصر</button>
<button class="btn yellow" style="width:100%" onclick="addPrayer(this,'المغرب')">🌇 المغرب</button>
<button class="btn burgundy" style="width:100%;grid-column:span 2" onclick="addPrayer(this,'العشاء')">🌙 العشاء</button>
</div>
</div>
</div>

<div id="qesas" class="hidden">
<div class="card yellow"><h3>1- آدم 🌿</h3><p>أول نبي خلقه الله من طين</p><div class="storyBox" id="s1">آدم عليه السلام أول البشر، خلقه الله من طين وأسكنه الجنة وعلمه الأسماء</div><button class="btn burgundy small" onclick="playStory('آدم عليه السلام أول البشر خلقه الله من طين وأسكنه الجنة وعلمه الأسماء كلها','s1')">🔊 اسمعي</button><button class="btn yellow small" onclick="addStar()">✅ سمعتها</button></div>
<div class="card light"><h3>2- نوح 🌊</h3><p>بنى سفينة كبيرة</p><div class="storyBox" id="s2">نوح دعا قومه تسعمائة وخمسين سنة وبنى سفينة أنقذت المؤمنين من الطوفان</div><button class="btn yellow small" onclick="playStory('نوح دعا قومه تسعمائة وخمسين سنة وبنى سفينة وأنقذ المؤمنين من الطوفان','s2')">🔊</button><button class="btn burgundy small" onclick="addStar()">✅</button></div>
<div class="card yellow"><h3>3- إبراهيم 🔥</h3><p>النار بقت برد وسلام</p><div class="storyBox" id="s3">إبراهيم خليل الرحمن، قال الله يا نار كوني بردا وسلاما على إبراهيم</div><button class="btn burgundy small" onclick="playStory('إبراهيم خليل الرحمن قال الله يا نار كوني بردا وسلاما على إبراهيم','s3')">🔊</button><button class="btn yellow small" onclick="addStar()">✅</button></div>
</div>

<div id="adab" class="hidden">
<div class="card yellow"><h3>😴 قبل النوم</h3><p>باسمك اللهم أموت وأحيا</p><button class="btn burgundy small" onclick="playStory('باسمك اللهم أموت وأحيا','')">🔊</button><button class="btn yellow small" onclick="addStar()">✅</button></div>
</div>

<div id="game" class="hidden"><div class="card light"><h3>🎨 لوني المسجد</h3><canvas id="paint" width="320" height="200"></canvas><button class="btn yellow" onclick="clearPaint()">امسحي 🧹</button><button class="btn burgundy" onclick="addStar()">خلصت ✅</button></div></div>
<div id="week" class="hidden"><div class="card yellow"><h3>📅 أسبوعي</h3><p>⭐ <span id="cAnas">0</span></p><button class="btn burgundy" onclick="resetWeek()">أسبوع جديد 🔄</button></div></div>
<div id="stars" class="hidden"><div class="card yellow" style="text-align:center"><h3>🏆 جايزتي</h3><p id="prizeText">كملي 5 فروض + قصة + دعاء = 7 نجوم</p><div style="font-size:44px" id="bigTree">🌱</div><div id="bigStars" style="font-weight:900;color:#5B0F11;font-size:18px">⭐ 0 / 7</div></div></div>

<div class="footer"><b>created by dinaalssawy</b><span>All Rights Reserved © 2026 - نور 🌙</span></div>
</div>

<script>
let stars=0,anas=0,prayed={};
let voices=[];
function loadVoices(){voices=speechSynthesis.getVoices();}
if('speechSynthesis' in window){
  loadVoices();
  if(speechSynthesis.onvoiceschanged!==undefined) speechSynthesis.onvoiceschanged=loadVoices;
}

function playStory(text,id){
  // اظهري النص فورا
  if(id){let box=document.getElementById(id); if(box){box.style.display='block'; box.innerText=text;}}
  
  // حاولي تشغلي الصوت - لازم يكون بعد ضغطة المستخدم
  if(!('speechSynthesis' in window)){alert(text);return;}
  try{
    speechSynthesis.cancel();
    // ثانية انتظار عشان الأصوات تحمل
    setTimeout(()=>{
      let u=new SpeechSynthesisUtterance(text);
      u.lang='ar-SA';
      u.rate=0.85;
      u.pitch=1;
      u.volume=1;
      let ar=voices.find(v=>v.lang && v.lang.toLowerCase().includes('ar'));
      if(ar) u.voice=ar;
      u.onstart=()=>{console.log('صوت شغال');};
      u.onerror=(e)=>{console.log('خطأ صوت',e);};
      speechSynthesis.speak(u);
    },100);
  }catch(e){alert(text+"\n\nالصوت مش مدعوم، اقرأي النص ده لأنس ولين 💛");}
}

function addStar(){
  try{let a=new(window.AudioContext||window.webkitAudioContext)();let o=a.createOscillator();let g=a.createGain();o.frequency.value=900;g.gain.value=0.15;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+0.2);}catch(e){}
  stars++; anas++; updateUI();
}
function addPrayer(btn,name){
  if(prayed[name]) return;
  prayed[name]=true;
  btn.classList.add('done');
  btn.innerText='✅ '+name;
  addStar();
}
function updateUI(){
  document.getElementById('starsCount').innerText=`⭐ ${stars} / 7 نجوم`;
  document.getElementById('bigStars').innerText=`⭐ ${stars} / 7`;
  document.getElementById('cAnas').innerText=stars;
  let icon='🌱'; if(stars>=2) icon='🌿'; if(stars>=4) icon='🌳'; if(stars>=7) icon='🌳🍎';
  document.getElementById('tree').innerText=icon;
  document.getElementById('bigTree').innerText=icon;
  if(stars>=7) document.getElementById('prizeText').innerText='ما شاء الله خلصتي الـ 5 فروض! 🌟';
}
function showTab(id,el){
  document.querySelectorAll('.wrap > div').forEach(d=>{if(d.id) d.classList.add('hidden')});
  document.getElementById(id).classList.remove('hidden');
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
}
function resetWeek(){stars=0;anas=0;prayed={};document.querySelectorAll('.btn.done').forEach(b=>b.classList.remove('done'));updateUI();}
let canvas=document.getElementById('paint'),ctx=canvas?.getContext('2d'),painting=false;
if(canvas){ctx.fillStyle='#fff';ctx.fillRect(0,0,320,200);ctx.strokeStyle='#5B0F11';ctx.lineWidth=2.5;ctx.strokeRect(90,70,140,60);ctx.beginPath();ctx.moveTo(80,70);ctx.lineTo(160,30);ctx.lineTo(240,70);ctx.closePath();ctx.stroke();function pos(e){let r=canvas.getBoundingClientRect();let t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*(320/r.width),y:(t.clientY-r.top)*(200/r.height)}}canvas.addEventListener('mousedown',e=>{painting=true;let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)});canvas.addEventListener('mousemove',e=>{if(!painting)return;let p=pos(e);ctx.lineTo(p.x,p.y);ctx.strokeStyle='#5B0F11';ctx.lineWidth=4;ctx.stroke()});window.addEventListener('mouseup',()=>painting=false);canvas.addEventListener('touchstart',e=>{painting=true;let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault()},{passive:false});canvas.addEventListener('touchmove',e=>{if(!painting)return;let p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()},{passive:false})}
function clearPaint(){ctx.clearRect(0,0,320,200);ctx.fillStyle='#fff';ctx.fillRect(0,0,320,200);ctx.strokeStyle='#5B0F11';ctx.lineWidth=2.5;ctx.strokeRect(90,70,140,60);ctx.beginPath();ctx.moveTo(80,70);ctx.lineTo(160,30);ctx.lineTo(240,70);ctx.closePath();ctx.stroke();}
</script>
</body>
</html>
