<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#FFF8E1;margin:0;font-family:Tahoma;text-align:center}
.header{background:#5B0F11;padding:30px;color:#FFD60A;border-radius:0 0 30px 30px;font-weight:900;font-size:28px;border-bottom:4px solid #FFD60A}
.card{background:#FFD60A;border:3px solid #5B0F11;border-radius:16px;margin:14px;padding:14px;box-shadow:0 4px 0 #5B0F11}
.btn{background:#5B0F11;color:#FFD60A;border:none;border-radius:10px;padding:12px 18px;margin:5px;font-weight:900}
</style>
</head>
<body>
<div class="header">🌙 نور - أنس ولين<br><small style="font-size:14px;color:#FFE082">نبيتي في أصفر مضيء</small></div>
<div class="card">⭐ <span id="s">0</span> / 7 نجوم - هدف اليوم: 5 فروض</div>
<div class="card">
<button class="btn" onclick="done(this)">🌅 الفجر</button>
<button class="btn" onclick="done(this)">☀️ الظهر</button>
<button class="btn" onclick="done(this)">🌤️ العصر</button>
<button class="btn" onclick="done(this)">🌇 المغرب</button>
<button class="btn" onclick="done(this)">🌙 العشاء</button>
</div>
<div class="card">
📖 قصة آدم<br>
<button class="btn" onclick="alert('آدم أول البشر خلقه الله من طين')">🔊 اسمعي القصة</button>
<button class="btn" style="background:#FFF3B0;color:#5B0F11;border:2px solid #5B0F11" onclick="add()">✅ سمعتها</button>
</div>
<script>
let n=0;
function done(b){if(b.innerText.includes('✅'))return;b.innerText='✅ '+b.innerText;n++;document.getElementById('s').innerText=n;}
function add(){n++;document.getElementById('s').innerText=n;alert('برافو ⭐');}
</script>
</body>
</html>
